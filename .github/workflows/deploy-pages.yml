name: Deploy static site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages paths
        shell: bash
        run: |
          pages_repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$pages_repository_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            pages_base_path=""
          else
            pages_base_path="/$pages_repository_name"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$pages_base_path" >> "$GITHUB_ENV"
          echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io${pages_base_path}" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static export
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
